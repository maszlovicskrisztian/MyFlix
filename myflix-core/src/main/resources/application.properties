spring.application.name=myflix-core

MEDIA_PATH=../test-media
HLS_PATH=../test-data/hls
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.images.base-url=https://image.tmdb.org/t/p

HLS_IDLE_TIMEOUT_MINUTES=1

spring.datasource.url=jdbc:h2:file:${DB_PATH:../test-data/myflix}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin123
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
