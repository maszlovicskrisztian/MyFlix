spring.application.name=myflix-core

# --- Local/dev defaults for path & operational tuning settings ---
# Docker and TrueNAS override these via their own environment: block.
MEDIA_PATH=Z:
MEDIA_INCLUDE_FOLDERS=Filmek,Sorozatok
HLS_PATH=../test-data/hls
DB_PATH=../test-data/myflix
HLS_IDLE_TIMEOUT_MINUTES=1
HLS_CLEANUP_INTERVAL_MINUTES=1
WATCHER_DEBOUNCE_MINUTES=10
FILE_INFO_PURGE_INTERVAL_HOURS=24
HLS_MAX_HEIGHT=2200

# --- Fixed, non-secret, environment-independent settings ---
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.images.base-url=https://image.tmdb.org/t/p
tmdb.series.watch-providers=8|119|337
jwt.expiration-ms=21600000
ffmpeg.path=ffmpeg
ffprobe.path=ffprobe

# --- Database ---
spring.datasource.url=jdbc:h2:file:${DB_PATH}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin123
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.myflix=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.file.name=${DB_PATH:./data}/logs/myflix.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7