services:
  myflix:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/data/myflix 
      - MEDIA_PATH=/media
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TMDB_API=${TMDB_API}
    volumes:
      - ./test-media:/media:ro
      - ./test-data:/data