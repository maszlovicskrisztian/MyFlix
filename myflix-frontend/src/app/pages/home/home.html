<div class="browse">
  <app-header></app-header>

  @if (loading()) {
    <app-loading-overlay></app-loading-overlay>
  } @else {
    <app-media-section
      layout="row"
      aspect="still"
      title="Megtekintés folytatása"
      [mediaBaseResponses]="continueWatching()"
      emptyMessage="Nincs megtekintés alatt álló tartalom."
      [routeLink]="'/media'">
    </app-media-section>
    <app-media-section
      layout="row"
      title="Ajánlott filmek"
      [mediaBaseResponses]="suggestedMovies()"
      emptyMessage="Nézz valamit, hogy tudjunk ajánlani.">
    </app-media-section>
    <app-media-section
      layout="row"
      title="Ajánlott Sorozatok"
      [mediaBaseResponses]="suggestedSeries()"
      emptyMessage="Nézz valamit, hogy tudjunk ajánlani.">
    </app-media-section>
    @if (unknownMedia().length > 0) {
      <app-media-section
        layout="grid"
        title="Ismeretlen média"
        [mediaBaseResponses]="unknownMedia()">
      </app-media-section>
    }
  }
</div>
