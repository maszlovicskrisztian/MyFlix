<div class="browse">
  <app-header></app-header>
  <!-- Holds episodes as well as movies, and an episode only has a 16:9 still. -->
  <app-media-section
    layout="row"
    aspect="still"
    title="Megtekintés folytatása"
    [mediaBaseResponses]="continueWatching()"
    emptyMessage="Nincs megtekintés alatt álló tartalom.">
  </app-media-section>
  <app-media-section 
    layout="row"
    title="Ajánlott filmek" 
    [mediaBaseResponses]="suggestedMovies()" 
    emptyMessage="Nézz valamit, hogy tudjunk ajánlani.">
  </app-media-section>
  <app-media-section 
    layout="row"
    title="Ajánlott Sorozatok" 
    [mediaBaseResponses]="suggestedSeries()" 
    emptyMessage="Nézz valamit, hogy tudjunk ajánlani.">
  </app-media-section>
  <app-media-section 
    layout="grid"
    title="Összes média" 
    [mediaBaseResponses]="allMedia()" 
    emptyMessage="Nincs elérhető média.">
  </app-media-section>
</div>
