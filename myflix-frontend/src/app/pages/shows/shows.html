<app-header (refreshRequested)="loadPage()"/>

@if (loading()) {
    <app-loading-overlay></app-loading-overlay>
} @else {
    <app-media-section
        layout="row"
        title=" {{ 'MEDIA_SECTION.TITLES.NEWLY_ADDED' | transloco }} "
        emptyMessage="Nincs elérhető új sorozat."
        [mediaBaseResponses]="newEpisodes()"
        [routeLink]="'/shows'">
    </app-media-section>
    <app-media-section
        layout="grid"
        title=" {{ 'MEDIA_SECTION.TITLES.ALL_SHOWS' | transloco }} "
        emptyMessage="Nincs elérhető sorozat."
        [mediaBaseResponses]="shows()"
        [maxCapacity]="50"
        [routeLink]="'/shows'">
    </app-media-section>
}
