<app-header (refreshRequested)="loadPage()"/>

@if (loading()) {
    <app-loading-overlay></app-loading-overlay>
} @else {
    <app-media-section
        layout="row"
        title=" {{ 'MEDIA_SECTION.TITLES.NEWLY_ADDED' | transloco }} "
        emptyMessage="Nincs elérhető új film."
        [mediaBaseResponses]="newMovies()">
    </app-media-section>
    <app-media-section
        layout="row"
        title=" {{ 'MEDIA_SECTION.TITLES.ACTION_MOVIES' | transloco }} "
        emptyMessage="Nincs elérhető akció film."
        [mediaBaseResponses]="actionMovies()"
        [maxCapacity]="50">
    </app-media-section>
    <app-media-section
        layout="grid"
        title=" {{ 'MEDIA_SECTION.TITLES.ALL_MOVIES' | transloco }} "
        emptyMessage="Nincs elérhető film."
        [mediaBaseResponses]="movies()"
        [maxCapacity]="30">
    </app-media-section>
}
