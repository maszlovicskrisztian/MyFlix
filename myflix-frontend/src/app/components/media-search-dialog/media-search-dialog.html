@if (open()) {
  <div class="overlay" (click)="close()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="search-dialog-title"
      (click)="$event.stopPropagation()">
      <h2 class="dialog__title" id="search-dialog-title">Keresés</h2>

      <div class="searchbar">
        <input #queryInput class="searchbar__input" type="search" name="query" [ngModel]="query()"
          (ngModelChange)="onQueryChange($event)" placeholder="Film vagy sorozat címe"
          autocomplete="off" />
        <span class="searchbar__status" aria-hidden="true">
          @if (busy()) {
            <span class="searchbar__spinner"></span>
          } @else {
            <svg class="searchbar__icon" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16 16 4.5 4.5" />
            </svg>
          }
        </span>
      </div>

      @if (error(); as message) {
        <p class="dialog__error" role="alert">{{ message }}</p>
      } @else if (results().length) {
        <ul class="results" role="list">
          @for (result of results(); track result.mediaId) {
            <li>
              <button class="results__item" type="button" (click)="select(result)">
                <span class="results__title">{{ result.title }}</span>
              </button>
            </li>
          }
        </ul>
      } @else if (searched() && !busy()) {
        <p class="dialog__empty">Nincs találat erre: „{{ query().trim() }}”</p>
      }
    </div>
  </div>
}
