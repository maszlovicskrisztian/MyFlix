@if (open()) {
  <div class="overlay" (click)="cancel()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="enrich-dialog-title"
      (click)="$event.stopPropagation()">
      <h2 class="dialog__title" id="enrich-dialog-title">{{ 'ENRICHMENT.IMDB_ID' | transloco }}</h2>
      <p class="dialog__text">
        {{ 'ENRICHMENT.DESCRIPTION' | transloco }}
      </p>

      <form class="dialog__form" (ngSubmit)="submit()">
        <input #imdbInput class="dialog__input" type="text" name="imdbId" [(ngModel)]="imdbId"
          placeholder="tt0111161" autocomplete="off" spellcheck="false" [disabled]="busy()"
          [attr.aria-invalid]="error() ? 'true' : null" aria-describedby="enrich-dialog-error" />

        @if (error(); as message) {
          <p class="dialog__error" id="enrich-dialog-error" role="alert">{{ message }}</p>
        }

        <div class="dialog__actions">
          <button class="btn dialog__btn dialog__btn--ghost" type="button" (click)="cancel()"
            [disabled]="busy()">
            {{ 'ENRICHMENT.CANCEL' | transloco }}
          </button>
          <button class="btn dialog__btn dialog__btn--primary" type="submit" [disabled]="busy()">
            {{ busy() ? 'ENRICHMENT.SUBMITTING' : 'ENRICHMENT.SUBMIT' | transloco }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
