<div class="player">
  @if (mediaId()) {
    <a class="player__back" [routerLink]="['/media', mediaId()]">
      <span class="player__back-icon" aria-hidden="true">‹</span> Vissza
    </a>

    <video class="player__video" controls autoplay [src]="streamUrl()"></video>
  } @else {
    <div class="player__loading">
      <div class="player__spinner" aria-hidden="true"></div>
    </div>
  }
</div>
